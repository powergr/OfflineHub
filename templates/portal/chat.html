<!doctype html>
<html lang="{{ current_lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ module.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; }
      header { padding: 14px 20px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:10px; }
      header a { color: var(--muted); text-decoration: none; font-size: 13px; }
      header .spacer { flex: 1; }
      #log { flex: 1; overflow-y: auto; padding: 24px 20px; max-width: 820px; width: 100%; margin: 0 auto; }
      .msg { display: flex; margin-bottom: 16px; }
      .msg.user { justify-content: flex-end; }
      .msg .bubble { max-width: 80%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.55; white-space: pre-wrap; }
      .msg.user .bubble { background: var(--accent2); color: #fff; border-bottom-right-radius: 4px; }
      .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .msg .role { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
      #composer { border-top: 1px solid var(--border); padding: 16px 20px; }
      #composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
      #prompt { flex:1; padding: 12px 14px; border-radius: var(--radius-sm); resize: none; }
      #send { padding: 0 22px; border-radius: var(--radius-sm); }
      .hint { color: var(--muted); font-size: 12px; text-align: center; padding-top: 10px; }
      .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header>
      <span style="font-size:20px">{{ module.emoji }}</span>
      <strong>{{ module.name }}</strong>
      <span class="spacer"></span>
      <span class="version-badge">v{{ app_version }}</span>
      <a href="/">&larr; {{ t('chat.back_to_hub') }}</a>
    </header>

    <div id="log">
      <div class="msg assistant"><div class="bubble"><div class="role">{{ t('chat.assistant_label') }}</div>{{ t('chat.greeting') }}</div></div>
    </div>

    <div id="composer">
      <form id="form">
        <textarea id="prompt" rows="1" placeholder="{{ t('chat.placeholder') }}"></textarea>
        <button id="send" type="submit">{{ t('common.send') }}</button>
      </form>
      <p class="hint">{{ t('chat.hint') }}</p>
    </div>

    <script>
      const T_ASSISTANT_LABEL = {{ t('chat.assistant_label') | tojson }};
      const T_QUEUE_PERSON = {{ t('chat.queue_person') | tojson }};
      const T_QUEUE_PEOPLE = {{ t('chat.queue_people') | tojson }};
      const T_QUEUE_SUFFIX = {{ t('chat.queue_suffix') | tojson }};
      const T_CONNECTION_ERROR = {{ t('chat.connection_error') | tojson }};
      const moduleId = {{ module_id | tojson }};
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const promptEl = document.getElementById("prompt");
      const sendBtn = document.getElementById("send");
      // Prior turns in this conversation - sent back with every request so
      // the model actually has memory of earlier messages. Without this,
      // every single message started a brand new conversation from
      // scratch (confirmed by reading the old code: it never sent or used
      // any history at all), so a follow-up like "can you simplify that?"
      // had no "that" to refer to.
      const history = [];

      function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "assistant") bubble.innerHTML = `<div class="role">${T_ASSISTANT_LABEL}</div>`;
        const body = document.createElement("span");
        body.textContent = text;
        bubble.appendChild(body);
        div.appendChild(bubble);
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return body;
      }

      async function send(prompt) {
        sendBtn.disabled = true;
        addMessage("user", prompt);
        const replyEl = addMessage("assistant", "");
        const spinner = document.createElement("span");
        spinner.className = "spinner";
        replyEl.parentElement.insertBefore(spinner, replyEl);
        const removeSpinner = () => { if (spinner.parentElement) spinner.remove(); };
        let hadError = false;
        let inQueue = false;

        try {
          const resp = await fetch(`/api/chat/${encodeURIComponent(moduleId)}/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt, history }),
          });
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split("\n\n");
            buffer = lines.pop();
            for (const chunk of lines) {
              // No .trim() here on purpose, and confirmed why by reproducing
              // the actual bug this caused: a token that's nothing but a
              // space (common between words/numbers - e.g. "The number", " ",
              // "0", ".11") makes the full SSE line "data:  " all-whitespace
              // after "data:", so trimming the whole line erased the token
              // entirely instead of just the one separator space after
              // "data:" - gluing words together ("number0.11"). The server
              // always sends well-formed "data: <content>" lines with no
              // stray leading whitespace, so trimming was never needed here.
              if (chunk.startsWith("data:")) {
                let text = chunk.slice(5);
                if (text.startsWith(" ")) text = text.slice(1);
                text = text.replace(/\\n/g, "\n");
                if (text.startsWith("[queue]")) {
                  // The server serializes generation one request at a time
                  // (CPU inference) - while this request is waiting its
                  // turn, show how many are ahead instead of leaving the
                  // student staring at a blank reply bubble wondering if
                  // anything is happening.
                  removeSpinner();
                  const n = text.slice(7).trim();
                  replyEl.textContent = `⏳ ${n} ${n === "1" ? T_QUEUE_PERSON : T_QUEUE_PEOPLE} ${T_QUEUE_SUFFIX}`;
                  inQueue = true;
                } else if (text.startsWith("[error]")) {
                  removeSpinner();
                  hadError = true;
                  replyEl.textContent += "\n" + text;
                } else {
                  removeSpinner();
                  if (inQueue) { replyEl.textContent = ""; inQueue = false; }
                  replyEl.textContent += text;
                }
                log.scrollTop = log.scrollHeight;
              }
            }
          }
        } catch (e) {
          removeSpinner();
          hadError = true;
          replyEl.textContent += "\n" + T_CONNECTION_ERROR;
        } finally {
          removeSpinner();
          // Only remembered on success - an error message isn't something
          // the model actually said, and feeding it back in as if it were
          // a real reply would corrupt every later turn in this chat.
          if (!hadError) {
            history.push({ role: "user", content: prompt });
            history.push({ role: "assistant", content: replyEl.textContent });
          }
          sendBtn.disabled = false;
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const prompt = promptEl.value.trim();
        if (!prompt) return;
        promptEl.value = "";
        send(prompt);
      });

      promptEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
