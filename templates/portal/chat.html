<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ module.name }}</title>
    <style>
      :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --accent2:#1f6feb; --text:#e6edf3; --muted:#8b949e; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column;
      }
      header { padding: 14px 20px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:10px; }
      header a { color: var(--muted); text-decoration: none; font-size: 13px; margin-left: auto; }
      #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
      .msg { margin-bottom: 18px; line-height: 1.55; white-space: pre-wrap; }
      .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
      .msg.user { color: #e6edf3; }
      .msg.assistant { color: #c9d1d9; }
      #composer { border-top: 1px solid var(--border); padding: 16px 20px; }
      #composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
      #prompt { flex:1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; resize: none; }
      #send { padding: 0 20px; border-radius: 10px; border: none; background: var(--accent2); color: #fff; font-weight: 600; cursor: pointer; }
      #send:disabled { background: #21262d; color: var(--muted); cursor: not-allowed; }
      .hint { color: var(--muted); font-size: 12px; text-align: center; padding-top: 8px; }
    </style>
  </head>
  <body>
    <header>
      <span style="font-size:20px">{{ module.emoji }}</span>
      <strong>{{ module.name }}</strong>
      <a href="/">&larr; Back to hub</a>
    </header>

    <div id="log">
      <div class="msg assistant"><div class="role">Assistant</div>Ask me anything. I run entirely offline on this machine.</div>
    </div>

    <div id="composer">
      <form id="form">
        <textarea id="prompt" rows="1" placeholder="Type a message…"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Runs on this computer's CPU — replies may take a moment.</p>
    </div>

    <script>
      const moduleId = {{ module_id | tojson }};
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const promptEl = document.getElementById("prompt");
      const sendBtn = document.getElementById("send");

      function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.innerHTML = `<div class="role">${role}</div>`;
        const body = document.createElement("span");
        body.textContent = text;
        div.appendChild(body);
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return body;
      }

      async function send(prompt) {
        sendBtn.disabled = true;
        addMessage("user", prompt);
        const replyEl = addMessage("assistant", "");

        try {
          const resp = await fetch(`/api/chat/${encodeURIComponent(moduleId)}/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split("\n\n");
            buffer = lines.pop();
            for (const chunk of lines) {
              const line = chunk.trim();
              if (line.startsWith("data:")) {
                const text = line.slice(5).trim().replace(/\\n/g, "\n");
                if (text.startsWith("[error]")) {
                  replyEl.textContent += "\n" + text;
                } else {
                  replyEl.textContent += text;
                }
                log.scrollTop = log.scrollHeight;
              }
            }
          }
        } catch (e) {
          replyEl.textContent += "\n[connection error]";
        } finally {
          sendBtn.disabled = false;
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const prompt = promptEl.value.trim();
        if (!prompt) return;
        promptEl.value = "";
        send(prompt);
      });

      promptEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
