<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — {{ module_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
      .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
      form { display:flex; gap:8px; margin-bottom: 24px; }
      input[type=text] { margin-top: 0; font-size:15px; }
      ul { list-style:none; padding:0; }
      li { padding:12px 0; border-bottom:1px solid var(--border); }
      a { text-decoration:none; }
      a:hover { text-decoration:underline; }
      .back { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top-row">
        <a class="back" href="/content/{{ module_id }}/">&larr; Back to article</a>
        <span class="version-badge">v{{ app_version }}</span>
      </div>
      <form method="get">
        <input type="text" name="q" value="{{ query }}" placeholder="Search this library…" autofocus />
        <button type="submit">Search</button>
      </form>

      {% if not has_search %}
        <p class="muted">This library doesn't have a built-in search index.</p>
      {% elif query and not results %}
        <p class="muted">No results for "{{ query }}".</p>
      {% elif results %}
        <ul>
          {% for title, path in results %}
            <li><a href="/content/{{ module_id }}/{{ path }}">{{ title }}</a></li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  </body>
</html>
